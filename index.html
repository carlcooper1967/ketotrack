<html lang="en">
<head>
<meta charset="UTF-8" />

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%233A3A3D%22/><polygon points=%2250,25 75,75 25,75%22 fill=%22%237A1F2B%22/></svg>" />

  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

  .ghostbtn { background: #F6F1F2; border: 1px solid #E9E7ED; border-radius: 8px; padding: 7px 10px; color: #7A1F2B; display: flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; }
  .banner { background: #FDF2E9; border: 1px solid #F2D9BC; border-radius: 12px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }

  .confetti-piece { position: fixed; top: -20px; width: 8px; height: 14px; opacity: 0.9; z-index: 999; animation: confetti-fall linear forwards; }

  }
</style>

<body>
<div id="root"></div>
<script type="text/plain" id="app-source">
const { useState, useEffect, useMemo, useRef } = React;

// ---------- Tokens ----------
const GRAY = '#1B5E3C';
const BURGUNDY = '#3A3A3D';
const WHITE = '#FFFFFF';
const TEXT = '#1F2024';
const MUTED = '#6B7280';
const BORDER = '#E9E7ED';
const BLUE = '#2563EB';
const RED = '#E11D2E';
const TRACK_BG = '#F1EFF1';
const MANUAL_GRAY = '#5F6368';

const MEALS = [
  { key: 'breakfast', label: 'Breakfast', emoji: '☕' },
  { key: 'lunch', label: 'Lunch', emoji: '🥪' },
  { key: 'dinner', label: 'Dinner', emoji: '🍽️' },
  { key: 'snacks', label: 'Snacks', emoji: '🍪' },
];

const DEFAULT_TARGETS = { calories: 1800, protein: 90, netCarbs: 25, fat: 150, water: 100 };
const LEVELS = [1, 2, 3].map((num, i) => {
  const carbs = [20, 50, 100][i];
  const calories = 1800, protein = 90;
  const fat = Math.round((calories - protein * 4 - carbs * 4) / 9);
  return { num, carbs, calories, protein, fat, water: 100 };
});

const load = (key, fallback) => {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch (e) { return fallback; }
};
const save = (key, value) => {
  try { localStorage.setItem(key, JSON.stringify(value)); queueSyncOp(key, JSON.stringify(value), false); } catch (e) { console.error('save failed', e); }
};
const DAY_KEY = (d) => `kt-day-${d}`;
const EMPTY_DAY = { meals: { breakfast: [], lunch: [], dinner: [], snacks: [] }, workouts: [], water: 0 };

// ---------- Cloud sync (device ID + key/value mirror of localStorage) ----------
const DEVICE_ID_KEY = 'kt-device-id';
const getDeviceId = () => {
  let id;
  try { id = localStorage.getItem(DEVICE_ID_KEY); } catch (e) { id = null; }
  if (!id) {
    id = (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : ('dev-' + Date.now() + '-' + Math.random().toString(36).slice(2));
    try { localStorage.setItem(DEVICE_ID_KEY, id); } catch (e) {}
  }
  return id;
};

const SYNC_QUEUE_KEY = 'kt-sync-queue';
let syncPushTimer = null;

const queueSyncOp = (key, value, deleted) => {
  if (key === SYNC_QUEUE_KEY || key === DEVICE_ID_KEY) return; // never sync sync-machinery itself
  try {
    const queue = JSON.parse(localStorage.getItem(SYNC_QUEUE_KEY) || '{}');
    queue[key] = { key, value: deleted ? null : value, deleted: !!deleted, updatedAt: Date.now() };
    localStorage.setItem(SYNC_QUEUE_KEY, JSON.stringify(queue));
  } catch (e) {}
  if (syncPushTimer) clearTimeout(syncPushTimer);
  syncPushTimer = setTimeout(flushSyncQueue, 1500);
};

const flushSyncQueue = async () => {
  let queue;
  try { queue = JSON.parse(localStorage.getItem(SYNC_QUEUE_KEY) || '{}'); } catch (e) { queue = {}; }
  const ops = Object.values(queue);
  if (ops.length === 0) return;
  try {
    const deviceId = getDeviceId();
    const res = await fetch('/api/sync', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ deviceId, ops }) });
    if (res.ok) localStorage.setItem(SYNC_QUEUE_KEY, '{}');
  } catch (e) { /* offline — queue stays for next flush attempt */ }
};

const pullFromCloud = async () => {
  try {
    const deviceId = getDeviceId();
    const res = await fetch('/api/sync?deviceId=' + encodeURIComponent(deviceId));
    if (!res.ok) return null;
    return await res.json();
  } catch (e) { return null; }
};

// One-time reconciliation on app start: if the cloud already has data for this device, it's the
// source of truth (pulled down into localStorage). If the cloud is empty, this is the first sync —
// push every existing local kt- key up as the initial migration.
const reconcileWithCloud = async () => {
  const cloud = await pullFromCloud();
  if (cloud === null) return 'offline'; // couldn't reach the backend — work from local storage as-is
  const cloudKeys = Object.keys(cloud.data || {});
  if (cloudKeys.length > 0) {
    cloudKeys.forEach(k => { try { localStorage.setItem(k, cloud.data[k]); } catch (e) {} });
    return 'pulled';
  }
  // cloud empty — migrate every existing local key up
  const ops = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('kt-') && k !== DEVICE_ID_KEY && k !== SYNC_QUEUE_KEY) {
      ops.push({ key: k, value: localStorage.getItem(k), deleted: false, updatedAt: Date.now() });
    }
  }
  if (ops.length > 0) {
    try {
      const deviceId = getDeviceId();
      await fetch('/api/sync', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ deviceId, ops }) });
    } catch (e) {}
  }
  return 'migrated';
};

const iso = (d) => {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
};
const todayISO = () => iso(new Date());
const startOfWeek = (dateISO) => { const d = new Date(dateISO + 'T00:00:00'); d.setDate(d.getDate() - d.getDay()); return d; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const dayLabel = (d) => ['S', 'M', 'T', 'W', 'T', 'F', 'S'][d.getDay()];
const fmtHeader = (dateISO) => new Date(dateISO + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
const monthKey = (dateISO) => dateISO.slice(0, 7);

function statColor(value, target, kind) {
  if (kind === 'floor') return value >= target ? BLUE : RED;
  return value <= target ? BLUE : RED;
}
const effective = (f) => {
  const pct = (f.percent ?? 100) / 100;
  return { protein: f.protein * pct, carbs: f.carbs * pct, fiber: f.fiber * pct, fat: f.fat * pct, calories: f.calories * pct };
};

// ---------- UI atoms ----------
function HydrationCard({ water, target, onAdd, gold }) {
  const [val, setVal] = useState('');
  const color = statColor(water, target, 'floor');
  const submit = () => {
    const n = parseFloat(val);
    if (!n || n === 0) return;
    if (n > 33) {
      const ok = window.confirm(`Add ${n}oz to Hydration? That's a lot for one entry — confirm this is right.`);
      if (!ok) return;
    }
    onAdd(n);
    setVal('');
  };
  const chips = [8, 12, 16, 20];
  return (
    <div className={gold ? 'card gold-card' : 'card'} style={{ padding: 14 }}>
      <div style={{ fontFamily: "'Oswald', sans-serif", fontSize: 12, letterSpacing: '0.05em', textTransform: 'uppercase', color: BURGUNDY, fontWeight: 600, marginBottom: 12, display: 'flex', alignItems: 'center', gap: 6 }}>
        💧 Hydration{gold && <span style={{ fontSize: 10, color: '#8A6D1D', fontWeight: 700 }}>🔥 7-day streak</span>}
      </div>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 10, marginBottom: 12 }}>
        <div style={{ display: 'flex', gap: 6, flex: '1 1 140px', minWidth: 140 }}>
          <input type="number" inputMode="decimal" value={val} onChange={e => setVal(e.target.value)} onKeyDown={e => e.key === 'Enter' && submit()} placeholder="oz" style={{ width: 70 }} />
          <button onClick={submit} style={{ background: BURGUNDY, border: 'none', borderRadius: 9, padding: '10px 14px', color: WHITE, fontWeight: 700, fontSize: 13, whiteSpace: 'nowrap' }}>+ Add</button>
        </div>
        <div style={{ textAlign: 'right' }}>
          <div style={{ fontFamily: "'Oswald', sans-serif", fontSize: 26, fontWeight: 700, color, lineHeight: 1, whiteSpace: 'nowrap' }}>{Math.round(water)}<span style={{ fontSize: 12, color: MUTED, fontWeight: 500 }}> oz</span></div>
          <div style={{ fontSize: 11, color: MUTED, marginTop: 2, whiteSpace: 'nowrap' }}>goal {target} oz</div>
        </div>
      </div>
      <div style={{ display: 'flex', gap: 6 }}>
        {chips.map(c => <button key={c} onClick={() => onAdd(c)} style={{ flex: 1, background: '#F6F1F2', border: `1px solid ${BORDER}`, borderRadius: 8, padding: '9px 0', fontSize: 12.5, fontWeight: 600, color: BURGUNDY }}>+{c}</button>)}
      </div>
    </div>
  );
}

function ConfettiOverlay() {
  const colors = ['#7A1F2B', '#E8C55A', '#1B5E3C', '#2563EB', '#FFFFFF'];
  const pieces = [...Array(40)].map((_, i) => ({
    id: i, left: Math.random() * 100, delay: Math.random() * 0.4, duration: 1.8 + Math.random() * 0.8,
    color: colors[i % colors.length], rotate: Math.random() * 360,
  }));
  return (
    <div style={{ position: 'fixed', inset: 0, pointerEvents: 'none', zIndex: 999 }}>
      {pieces.map(p => (
        <div key={p.id} className="confetti-piece" style={{ left: `${p.left}%`, background: p.color, animationDelay: `${p.delay}s`, animationDuration: `${p.duration}s`, transform: `rotate(${p.rotate}deg)` }} />
      ))}
    </div>
  );
}

function RowStat({ label, emoji, value, target, unit, kind, note, gold }) {
  const color = statColor(value, target, kind);
  const pct = Math.min(100, (value / target) * 100);
  return (
    <div className={gold ? 'card gold-card' : 'card'} style={{ border: `1px solid ${BORDER}`, borderRadius: 12, padding: '10px 8px', boxShadow: '0 1px 3px rgba(0,0,0,0.04)', flex: 1, minWidth: 0 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 4, marginBottom: 6 }}>
        <span style={{ fontSize: 11 }}>{emoji}</span>
        <span style={{ fontFamily: "'Oswald', sans-serif", fontSize: 8.5, letterSpacing: '0.03em', textTransform: 'uppercase', color: BURGUNDY, fontWeight: 700, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{label}</span>
        {gold && <span style={{ fontSize: 8, color: '#8A6D1D', fontWeight: 700, marginLeft: 'auto' }}>🔥7d</span>}
      </div>
      <div style={{ fontFamily: "'Oswald', sans-serif", fontSize: 19, fontWeight: 700, color, lineHeight: 1 }}>{Math.round(value)}<span style={{ fontSize: 10, color: MUTED, fontWeight: 500 }}>{unit}</span></div>
      <div style={{ fontSize: 9.5, color: MUTED, marginTop: 2 }}>/ {target}{unit}</div>
      <div style={{ height: 4, background: TRACK_BG, borderRadius: 2, marginTop: 6, overflow: 'hidden' }}>
        <div style={{ height: '100%', width: `${pct}%`, background: color, borderRadius: 2 }} />
      </div>
      {note && <div style={{ fontSize: 9, color: MUTED, marginTop: 4 }}>{note}</div>}
    </div>
  );
}

function Modal({ title, onClose, children }) {
  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(30,10,20,0.5)', display: 'flex', alignItems: 'flex-end', justifyContent: 'center', zIndex: 50 }}>
      <div style={{ background: WHITE, borderRadius: '16px 16px 0 0', padding: 22, width: '100%', maxWidth: 480, maxHeight: '88vh', overflowY: 'auto' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 18 }}>
          <span style={{ fontFamily: "'Oswald', sans-serif", fontSize: 17, fontWeight: 700, color: BURGUNDY }}>{title}</span>
          <button onClick={onClose} style={{ background: 'none', border: 'none', color: MUTED, fontSize: 20 }}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}
function Field({ label, children }) {
  return <div style={{ marginBottom: 12 }}><label style={{ fontSize: 12, color: MUTED, display: 'block', marginBottom: 5, fontWeight: 500 }}>{label}</label>{children}</div>;
}
function PrimaryButton({ onClick, label = 'Save', style, disabled }) {
  return <button onClick={onClick} disabled={disabled} style={{ width: '100%', background: disabled ? '#C9C6D1' : BURGUNDY, border: 'none', borderRadius: 9, padding: 13, color: WHITE, fontWeight: 700, fontSize: 14, marginTop: 6, ...style }}>{label}</button>;
}
function Checkbox({ checked, onClick, label }) {
  return (
    <button onClick={onClick} style={{ display: 'flex', alignItems: 'center', gap: 9, background: 'none', border: 'none', padding: '6px 0 2px' }}>
      <div style={{ width: 18, height: 18, borderRadius: 5, border: `1.5px solid ${checked ? BURGUNDY : '#C9C6D1'}`, background: checked ? BURGUNDY : 'transparent', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
        {checked && <span style={{ color: WHITE, fontSize: 11, fontWeight: 700 }}>✓</span>}
      </div>
      <span style={{ fontSize: 13, color: TEXT }}>{label}</span>
    </button>
  );
}

function HomeScreenSteps() {
  return (
    <div>
      <div style={{ marginBottom: 16 }}>
        <div style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: 13, color: BURGUNDY, marginBottom: 8 }}>iPhone (Safari)</div>
        <ol style={{ fontSize: 13, color: TEXT, paddingLeft: 18, lineHeight: 1.8 }}>
          <li>Tap the Share icon at the bottom of the screen</li>
          <li>Scroll down and tap "Add to Home Screen"</li>
          <li>Tap "Add" in the top right</li>
        </ol>
      </div>
      <div>
        <div style={{ fontFamily: "'Oswald', sans-serif", fontWeight: 600, fontSize: 13, color: BURGUNDY, marginBottom: 8 }}>Android (Chrome)</div>
        <ol style={{ fontSize: 13, color: TEXT, paddingLeft: 18, lineHeight: 1.8 }}>
          <li>Tap the ⋮ menu in the top right</li>
          <li>Tap "Add to Home Screen"</li>
          <li>Tap "Add" to confirm</li>
        </ol>
      </div>
    </div>
  );
}

// =====================================================================
function CarbTrack() {
  const [profile, setProfile] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [pinStatus, setPinStatus] = useState('checking'); // 'checking' | 'need-setup' | 'need-verify' | 'unlocked'
  const [selectedDate, setSelectedDate] = useState(todayISO());
  const [weekAnchor, setWeekAnchor] = useState(todayISO());
  const [dayData, setDayData] = useState(EMPTY_DAY);
  const [weightLog, setWeightLog] = useState([]);
  const [bpLog, setBpLog] = useState([]);
  const [measureLog, setMeasureLog] = useState([]);
  const [sleepLog, setSleepLog] = useState([]);
  const [commonFoods, setCommonFoods] = useState([]);
  const [dismissed, setDismissed] = useState({});

  const [addFoodMeal, setAddFoodMeal] = useState(null);
  const [aiMeal, setAiMeal] = useState(null);
  const [editFood, setEditFood] = useState(null);
  const [showAddWorkout, setShowAddWorkout] = useState(false);
  const [showWeightForm, setShowWeightForm] = useState(false);
  const [showBpForm, setShowBpForm] = useState(false);
  const [showMeasureForm, setShowMeasureForm] = useState(false);
  const [showSleepForm, setShowSleepForm] = useState(false);
  const [editSleep, setEditSleep] = useState(null);
  const [showWorkoutAi, setShowWorkoutAi] = useState(false);
  const [showTrainingType, setShowTrainingType] = useState(false);
  const [pendingTrainingType, setPendingTrainingType] = useState(null);
  const [showTrainingMethod, setShowTrainingMethod] = useState(false);
  const [showWeightHistory, setShowWeightHistory] = useState(false);
  const [showBpHistory, setShowBpHistory] = useState(false);
  const [showMeasureHistory, setShowMeasureHistory] = useState(false);
  const [showSleepHistory, setShowSleepHistory] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [showHistory, setShowHistory] = useState(false);
  const [showHome, setShowHome] = useState(false);
  const [popup, setPopup] = useState(null);
  const [pickMealFor, setPickMealFor] = useState(null); // Frequent Foods item awaiting meal choice
  const [editRegular, setEditRegular] = useState(null);
  const [showRegulars, setShowRegulars] = useState(false);
  const [confettiFor, setConfettiFor] = useState(null);
  const [expandedMeals, setExpandedMeals] = useState({});

  useEffect(() => {
    (async () => {
      await reconcileWithCloud(); // pull cloud data (or migrate local -> cloud on first run)
      setProfile(load('kt-profile', null));
      setWeightLog(load('kt-weight-log', []));
      setBpLog(load('kt-bp-log', []));
      setMeasureLog(load('kt-measure-log', []));
      setSleepLog(load('kt-sleep-log', []));
      setCommonFoods(load('kt-common-foods', []));
      setDismissed(load('kt-dismissed', {}));
      setLoaded(true);

      // PIN gate check — only meaningful once a profile exists (no point gating an empty first-run)
      const hasProfile = !!load('kt-profile', null);
      if (!hasProfile) { setPinStatus('unlocked'); return; }
      try {
        const deviceId = getDeviceId();
        const res = await fetch('/api/auth?action=check', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ deviceId }) });
        if (!res.ok) { setPinStatus('unlocked'); return; } // backend unreachable — don't lock the person out
        const data = await res.json();
        if (!data.hasPin) setPinStatus('need-setup');
        else if (!data.verifiedThisMonth) setPinStatus('need-verify');
        else setPinStatus('unlocked');
      } catch (e) {
        setPinStatus('unlocked'); // offline — don't lock the person out of their own local data
      }
    })();
  }, []);

  useEffect(() => { setDayData(load(DAY_KEY(selectedDate), EMPTY_DAY)); }, [selectedDate]);

  const targets = profile?.targets || DEFAULT_TARGETS;
  const goalWeight = profile?.goalWeight || 200;

  const persistDay = (next) => { setDayData(next); save(DAY_KEY(selectedDate), next); };
  const persistWeight = (next) => { setWeightLog(next); save('kt-weight-log', next); };
  const persistBp = (next) => { setBpLog(next); save('kt-bp-log', next); };
  const persistMeasure = (next) => { setMeasureLog(next); save('kt-measure-log', next); };
  const persistSleep = (next) => { setSleepLog(next); save('kt-sleep-log', next); };
  const updateSleep = (id, updates) => {
    const idx = id ? sleepLog.findIndex(s => s.id === id) : -1;
    const targetIdx = idx >= 0 ? idx : sleepLog.length - 1;
    if (targetIdx < 0) return;
    const next = [...sleepLog];
    next[targetIdx] = { ...next[targetIdx], ...updates };
    persistSleep(next);
  };
  const persistCommon = (next) => { setCommonFoods(next); save('kt-common-foods', next); };
  const persistDismissed = (partial) => {
    setDismissed(prev => {
      const next = { ...prev, ...partial };
      save('kt-dismissed', next);
      return next;
    });
  };

  const allFoods = useMemo(() => Object.values(dayData.meals || {}).flat(), [dayData]);
  const totals = allFoods.reduce((acc, f) => {
    const e = effective(f);
    return { calories: acc.calories + e.calories, protein: acc.protein + e.protein, netCarbs: acc.netCarbs + Math.max(0, e.carbs - e.fiber), fat: acc.fat + e.fat };
  }, { calories: 0, protein: 0, netCarbs: 0, fat: 0 });
  const caloriesBurned = (dayData.workouts || []).reduce((sum, w) => sum + (w.activeCalories || 0), 0);
  const netCalories = Math.max(0, totals.calories - caloriesBurned);

  // record / bump a food's frequency in Frequent Foods (unified across meals, no fuzzy matching)
  const recordCommonFood = (food, snapshot) => {
    const key = food.name.trim().toLowerCase();
    const idx = snapshot.findIndex(cf => cf.name.trim().toLowerCase() === key);
    if (idx >= 0) {
      const next = [...snapshot];
      next[idx] = { ...next[idx], count: (next[idx].count || 1) + 1 };
      return next;
    }
    return [...snapshot, { id: Date.now() + Math.random(), name: food.name, protein: food.protein, carbs: food.carbs, fiber: food.fiber, fat: food.fat, calories: food.calories, count: 1, pinned: false }];
  };

  const addFood = (mealKey, food) => {
    const next = { ...dayData, meals: { ...dayData.meals, [mealKey]: [...dayData.meals[mealKey], { ...food, id: Date.now() + Math.random(), percent: 100 }] } };
    persistDay(next);
    persistCommon(recordCommonFood(food, commonFoods));
    const e = effective({ ...food, percent: 100 });
    const netC = Math.max(0, e.carbs - e.fiber);
    const carbThird = targets.netCarbs / 3, proteinThird = targets.protein / 3;
    setPopup({ carbs: { value: netC, over: netC > carbThird, third: carbThird }, protein: { value: e.protein, over: e.protein < proteinThird, third: proteinThird } });
  };

  const addFoodBatch = (mealKey, foods, estimated) => {
    const stamped = foods.map(f => ({ ...f, id: Date.now() + Math.random(), percent: 100, estimated: !!estimated }));
    const hydrationAdd = foods.reduce((sum, f) => sum + (f.hydrationOz || 0), 0);
    const next = { ...dayData, meals: { ...dayData.meals, [mealKey]: [...dayData.meals[mealKey], ...stamped] }, water: Math.max(0, dayData.water + hydrationAdd) };
    persistDay(next);
    let cf = commonFoods;
    foods.forEach(f => { cf = recordCommonFood(f, cf); });
    persistCommon(cf);
    const totals2 = foods.reduce((acc, f) => {
      const e = effective({ ...f, percent: 100 });
      return { carbs: acc.carbs + Math.max(0, e.carbs - e.fiber), protein: acc.protein + e.protein };
    }, { carbs: 0, protein: 0 });
    const carbThird = targets.netCarbs / 3, proteinThird = targets.protein / 3;
    setPopup({ carbs: { value: totals2.carbs, over: totals2.carbs > carbThird, third: carbThird }, protein: { value: totals2.protein, over: totals2.protein < proteinThird, third: proteinThird }, hydrationAdded: hydrationAdd > 0 ? hydrationAdd : null });
  };

  const updateFood = (mealKey, id, updates) => persistDay({ ...dayData, meals: { ...dayData.meals, [mealKey]: dayData.meals[mealKey].map(f => f.id === id ? { ...f, ...updates } : f) } });
  const removeFood = (mealKey, id) => persistDay({ ...dayData, meals: { ...dayData.meals, [mealKey]: dayData.meals[mealKey].filter(f => f.id !== id) } });

  const logRegularsToMeal = (regulars, mealKey) => {
    const list = Array.isArray(regulars) ? regulars : [regulars];
    addFoodBatch(mealKey, list.map(r => {
      const q = r.qty && r.qty > 0 ? r.qty : 1;
      return { name: q !== 1 ? `${q}x ${r.name}` : r.name, protein: r.protein * q, carbs: r.carbs * q, fiber: r.fiber * q, fat: r.fat * q, calories: r.calories * q };
    }), false);
    setPickMealFor(null);
  };
  const togglePinRegular = (id) => persistCommon(commonFoods.map(cf => cf.id === id ? { ...cf, pinned: !cf.pinned } : cf));
  const deleteRegular = (id) => persistCommon(commonFoods.filter(cf => cf.id !== id));
  const updateRegular = (id, updates) => persistCommon(commonFoods.map(cf => cf.id === id ? { ...cf, ...updates } : cf));

  // one-time cleanup: strip leading quantities from names, merge items that match after normalization,
  // averaging their per-unit macros and combining frequency counts
  const cleanupFrequentFoods = () => {
    const normalize = (name) => {
      const m = name.trim().match(/^(\d+(?:\.\d+)?)\s+(.*)$/);
      const qty = m ? parseFloat(m[1]) : 1;
      const rest = m ? m[2] : name.trim();
      let key = rest.toLowerCase().trim();
      if (key.endsWith('s') && key.length > 3) key = key.slice(0, -1);
      return { qty: qty || 1, rest, key };
    };
    const groups = {};
    commonFoods.forEach(cf => {
      const { qty, rest, key } = normalize(cf.name);
      const groupKey = (cf.restaurant || '') + '|' + key;
      (groups[groupKey] = groups[groupKey] || []).push({ ...cf, _qty: qty, _rest: rest });
    });
    const merged = [];
    let mergedCount = 0;
    Object.values(groups).forEach(items => {
      if (items.length === 1) { merged.push(commonFoods.find(cf => cf.id === items[0].id)); return; }
      mergedCount += items.length - 1;
      const perUnit = items.map(it => ({ protein: it.protein / it._qty, carbs: it.carbs / it._qty, fiber: it.fiber / it._qty, fat: it.fat / it._qty, calories: it.calories / it._qty }));
      const avg = perUnit.reduce((acc, p) => ({ protein: acc.protein + p.protein, carbs: acc.carbs + p.carbs, fiber: acc.fiber + p.fiber, fat: acc.fat + p.fat, calories: acc.calories + p.calories }), { protein: 0, carbs: 0, fiber: 0, fat: 0, calories: 0 });
      const n = perUnit.length;
      const totalCount = items.reduce((s, it) => s + (it.count || 1), 0);
      const anyPinned = items.some(it => it.pinned);
      const canonical = items.reduce((a, b) => (b.count || 1) > (a.count || 1) ? b : a);
      merged.push({
        id: canonical.id, name: canonical._rest, restaurant: canonical.restaurant || null,
        protein: avg.protein / n, carbs: avg.carbs / n, fiber: avg.fiber / n, fat: avg.fat / n, calories: avg.calories / n,
        count: totalCount, pinned: anyPinned,
      });
    });
    persistCommon(merged);
    return mergedCount;
  };

  const addWorkout = (w) => persistDay({ ...dayData, workouts: [...dayData.workouts, { ...w, id: Date.now() }] });
  const removeWorkout = (id) => persistDay({ ...dayData, workouts: dayData.workouts.filter(w => w.id !== id) });
  const addWater = (amt) => persistDay({ ...dayData, water: Math.max(0, dayData.water + amt) });

  const latestWeight = weightLog.length ? weightLog[weightLog.length - 1].weight : null;
  const startWeight = weightLog.length ? weightLog[0].weight : null;
  const latestBp = bpLog.length ? bpLog[bpLog.length - 1] : null;
  const latestSleep = sleepLog.find(s => s.date === selectedDate) || null;
  const mostRecentSleep = sleepLog.length ? sleepLog[sleepLog.length - 1] : null;

  const weeksToGoal = useMemo(() => {
    if (weightLog.length < 2 || !goalWeight) return null;
    const first = weightLog[0], last = weightLog[weightLog.length - 1];
    const days = (new Date(last.date) - new Date(first.date)) / 86400000;
    if (days <= 0) return null;
    const ratePerDay = (first.weight - last.weight) / days;
    const remaining = last.weight - goalWeight;
    if (remaining <= 0) return 0;
    if (ratePerDay <= 0) return null;
    return Math.ceil(remaining / (ratePerDay * 7));
  }, [weightLog, goalWeight]);

  const totalInchesLost = useMemo(() => {
    if (measureLog.length < 2) return null;
    const first = measureLog[0], last = measureLog[measureLog.length - 1];
    const keys = ['waist', 'chest', 'hips', 'arms', 'thighs'];
    let total = 0;
    keys.forEach(k => { if (first[k] && last[k]) total += (first[k] - last[k]); });
    return total;
  }, [measureLog]);

  const computeCategoryStreak = (getDayTotal, target, kind) => {
    let count = 0;
    for (let i = 1; i <= 90; i++) { // start at 1 (yesterday) — today's in-progress totals don't count toward the streak yet
      const d = iso(addDays(new Date(), -i));
      const parsed = load(DAY_KEY(d), null);
      if (!parsed) break;
      const val = getDayTotal(parsed);
      const pass = kind === 'any' ? val : (kind === 'floor' ? val >= target : val <= target);
      if (pass) count++;
      else break;
    }
    return count;
  };

  const dayMacroTotals = (parsed) => {
    const foods = Object.values(parsed.meals || {}).flat();
    return foods.reduce((acc, f) => { const e = effective(f); return { calories: acc.calories + e.calories, protein: acc.protein + e.protein, netCarbs: acc.netCarbs + Math.max(0, e.carbs - e.fiber), fat: acc.fat + e.fat }; }, { calories: 0, protein: 0, netCarbs: 0, fat: 0 });
  };

  const streaks = useMemo(() => ({
    protein: computeCategoryStreak(p => dayMacroTotals(p).protein, targets.protein, 'floor'),
    netCarbs: computeCategoryStreak(p => dayMacroTotals(p).netCarbs, targets.netCarbs, 'ceiling'),
    calories: computeCategoryStreak(p => {
      const burned = (p.workouts || []).reduce((s, w) => s + (w.activeCalories || 0), 0);
      return Math.max(0, dayMacroTotals(p).calories - burned);
    }, targets.calories, 'ceiling'),
    fat: computeCategoryStreak(p => dayMacroTotals(p).fat, targets.fat, 'floor'),
    hydration: computeCategoryStreak(p => p.water || 0, targets.water, 'floor'),
    training: computeCategoryStreak(p => (p.workouts || []).length > 0, null, 'any'),
  }), [dayData, targets]);

  const goldCards = useMemo(() => ({
    protein: streaks.protein >= 7, netCarbs: streaks.netCarbs >= 7, calories: streaks.calories >= 7,
    fat: streaks.fat >= 7, hydration: streaks.hydration >= 7, training: streaks.training >= 7,
  }), [streaks]);

  // trigger confetti once per calendar day, the day a category first reaches a 7+ streak
  useEffect(() => {
    const todayKey = todayISO();
    let fired = null;
    Object.entries(goldCards).forEach(([cat, isGold]) => {
      if (isGold && dismissed['goldCelebrated_' + cat] !== todayKey) fired = cat;
    });
    if (fired) {
      setConfettiFor(fired);
      persistDismissed({ ['goldCelebrated_' + fired]: todayKey });
      setTimeout(() => setConfettiFor(null), 2600);
    }
  }, [goldCards.protein, goldCards.netCarbs, goldCards.calories, goldCards.fat, goldCards.hydration, goldCards.training]);


  const weekComparison = useMemo(() => {
    const avgProtein = (offsetStart) => {
      let total = 0, n = 0;
      for (let i = offsetStart; i < offsetStart + 7; i++) {
        const d = iso(addDays(new Date(), -i));
        const parsed = load(DAY_KEY(d), null);
        if (!parsed) continue;
        const foods = Object.values(parsed.meals || {}).flat();
        total += foods.reduce((sum, f) => sum + effective(f).protein, 0);
        n++;
      }
      return n ? total / n : null;
    };
    const thisWeek = avgProtein(0), lastWeek = avgProtein(7);
    if (thisWeek === null || lastWeek === null) return null;
    return Math.round(thisWeek - lastWeek);
  }, [dayData]);

  const weekDays = useMemo(() => { const start = startOfWeek(weekAnchor); return [...Array(7)].map((_, i) => addDays(start, i)); }, [weekAnchor]);

  const today = new Date();
  const isFriday = today.getDay() === 5;
  const loggedWeightToday = weightLog.some(w => w.date === todayISO());
  const showFridayReminder = isFriday && !loggedWeightToday && dismissed.friday !== todayISO();

  const dom = today.getDate();
  const loggedBpThisMonth = bpLog.some(b => monthKey(b.date) === monthKey(todayISO()));
  const showBpReminder = (dom === 1 || dom === 4) && !loggedBpThisMonth && dismissed.bp !== monthKey(todayISO());

  const showInstallCard = dismissed.install !== true;
  const goalMet = latestWeight !== null && goalWeight !== null && latestWeight <= goalWeight;
  const showGoalMetPrompt = goalMet && dismissed.goalMet !== goalWeight;

  const share = () => {
    if (navigator.share) navigator.share({ title: 'CarbTrack', text: 'Check out CarbTrack, the keto macro tracker I\'ve been using — tap to try it:', url: window.location.href }).catch(() => {});
    else { navigator.clipboard?.writeText(window.location.href); alert('Link copied — send it to anyone you want to share CarbTrack with!'); }
  };

  const exportCSV = () => {
    const keys = Object.keys(localStorage).filter(k => k.startsWith('kt-day-')).sort();
    const wMap = Object.fromEntries(weightLog.map(w => [w.date, w.weight]));
    const bpMap = Object.fromEntries(bpLog.map(b => [b.date, `${b.systolic}/${b.diastolic}`]));
    const rows = [['Date', 'Calories', 'Protein (g)', 'Net Carbs (g)', 'Fat (g)', 'Water (oz)', 'Weight (lbs)', 'Blood Pressure']];
    keys.forEach(k => {
      const date = k.replace('kt-day-', '');
      const d = load(k, EMPTY_DAY);
      const foods = Object.values(d.meals || {}).flat();
      const t = foods.reduce((acc, f) => { const e = effective(f); return { calories: acc.calories + e.calories, protein: acc.protein + e.protein, netCarbs: acc.netCarbs + Math.max(0, e.carbs - e.fiber), fat: acc.fat + e.fat }; }, { calories: 0, protein: 0, netCarbs: 0, fat: 0 });
      rows.push([date, Math.round(t.calories), Math.round(t.protein), Math.round(t.netCarbs), Math.round(t.fat), d.water || 0, wMap[date] ?? '', bpMap[date] ?? '']);
    });
    const csv = rows.map(r => r.join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `ketotrack-export-${todayISO()}.csv`;
    a.click();
  };

  if (!loaded) return <div style={{ background: GRAY, minHeight: '100vh' }} />;
  if (!profile) return <ProfileSetup onDone={(p) => {
    save('kt-profile', p);
    setProfile(p);
    if (p.currentWeight) persistWeight([{ date: todayISO(), weight: p.currentWeight, note: '' }]);
    setPinStatus('need-setup'); // brand new profile — set up cloud protection right after
  }} />;

  if (pinStatus === 'need-setup') return <PinSetupScreen onDone={() => setPinStatus('unlocked')} />;
  if (pinStatus === 'need-verify') return <PinVerifyScreen onUnlocked={() => setPinStatus('unlocked')} />;
  if (pinStatus === 'checking') return <div style={{ background: GRAY, minHeight: '100vh' }} />;

  const regularsSorted = [...commonFoods].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || (b.count || 1) - (a.count || 1));

  return (
    <div style={{ background: GRAY, minHeight: '100vh', fontFamily: "'Inter', sans-serif", color: TEXT, paddingBottom: 40 }}>
      <div style={{ background: BURGUNDY, padding: '22px 20px 18px' }}>
        <div style={{ maxWidth: 480, margin: '0 auto', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <div style={{ width: 0, height: 0, borderLeft: '13px solid transparent', borderRight: '13px solid transparent', borderBottom: `21px solid ${GRAY}` }} />
            <h1 style={{ fontFamily: "'Oswald', sans-serif", fontSize: 22, fontWeight: 700, margin: 0, color: WHITE, letterSpacing: '-0.01em' }}>CarbTrack</h1>
          </div>
          <button onClick={() => setShowSettings(true)} style={{ background: 'rgba(255,255,255,0.15)', border: 'none', borderRadius: 8, padding: '8px 10px', color: WHITE, fontSize: 15 }}>⚙</button>
        </div>

        <div style={{ maxWidth: 480, margin: '18px auto 0', display: 'flex', alignItems: 'center', gap: 4 }}>
          <button onClick={() => setWeekAnchor(iso(addDays(startOfWeek(weekAnchor), -7)))} style={{ background: 'none', border: 'none', color: 'rgba(255,255,255,0.7)', padding: 2, fontSize: 16 }}>‹</button>
          <div style={{ flex: 1, display: 'flex', justifyContent: 'space-between' }}>
            {weekDays.map(d => {
              const dISO = iso(d);
              const isSelected = dISO === selectedDate;
              const isToday = dISO === todayISO();
              return (
                <button key={dISO} onClick={() => setSelectedDate(dISO)} style={{ background: 'none', border: 'none', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 5 }}>
                  <span style={{ fontSize: 10, color: 'rgba(255,255,255,0.6)', fontWeight: 600 }}>{dayLabel(d)}</span>
                  <span style={{ width: 28, height: 28, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', background: isSelected ? WHITE : 'transparent', border: isToday && !isSelected ? '1.5px dashed rgba(255,255,255,0.6)' : 'none', color: isSelected ? BURGUNDY : WHITE, fontSize: 12, fontWeight: 700 }}>{d.getDate()}</span>
                </button>
              );
            })}
          </div>
          <button onClick={() => setWeekAnchor(iso(addDays(startOfWeek(weekAnchor), 7)))} style={{ background: 'none', border: 'none', color: 'rgba(255,255,255,0.7)', padding: 2, fontSize: 16 }}>›</button>
        </div>

        <button onClick={share} style={{ display: 'block', width: '100%', maxWidth: 480, margin: '16px auto 0', background: 'rgba(255,255,255,0.12)', border: 'none', borderRadius: 10, padding: '11px 14px', textAlign: 'left', fontSize: 12.5 }}>
          <span style={{ color: 'rgba(255,255,255,0.75)' }}>Know someone who'd like this?  </span>
          <span style={{ color: WHITE, fontWeight: 700 }}>Share CarbTrack →</span>
        </button>
      </div>

      <div style={{ maxWidth: 480, margin: '0 auto', padding: '20px 20px 0', display: 'flex', flexDirection: 'column', gap: 16 }}>

        {showInstallCard && (
          <div className="banner" style={{ background: '#F6F1F2', borderColor: BORDER }}>
            <span style={{ fontSize: 13, color: TEXT }}>📱 Add CarbTrack to your Home Screen so it opens like a real app.</span>
            <div style={{ display: 'flex', gap: 6, flexShrink: 0 }}>
              <button className="pill" onClick={() => setShowHome(true)}>Show me</button>
              <button onClick={() => persistDismissed({ install: true })} style={{ background: 'none', border: 'none', color: MUTED, fontSize: 16 }}>✕</button>
            </div>
          </div>
        )}

        {showFridayReminder && (
          <div className="banner">
            <span style={{ fontSize: 13, color: '#7A4A1F' }}>It's Friday — log this week's weigh-in.</span>
            <div style={{ display: 'flex', gap: 6, flexShrink: 0 }}>
              <button className="pill" style={{ background: '#B8721F' }} onClick={() => setShowWeightForm(true)}>Log</button>
              <button onClick={() => persistDismissed({ friday: todayISO() })} style={{ background: 'none', border: 'none', color: '#7A4A1F', fontSize: 16 }}>✕</button>
            </div>
          </div>
        )}
        {showBpReminder && (
          <div className="banner">
            <span style={{ fontSize: 13, color: '#7A4A1F' }}>Time to check &amp; log your blood pressure this month.</span>
            <div style={{ display: 'flex', gap: 6, flexShrink: 0 }}>
              <button className="pill" style={{ background: '#B8721F' }} onClick={() => setShowBpForm(true)}>Log</button>
              <button onClick={() => persistDismissed({ bp: monthKey(todayISO()) })} style={{ background: 'none', border: 'none', color: '#7A4A1F', fontSize: 16 }}>✕</button>
            </div>
          </div>
        )}

        {showGoalMetPrompt && (
          <div className="banner" style={{ background: '#EAF3EA', borderColor: '#C6E5C6' }}>
            <span style={{ fontSize: 13, color: '#2E7D32' }}>🎉 Goal weight reached! Time to remeasure and set a new goal?</span>
            <div style={{ display: 'flex', gap: 6, flexShrink: 0 }}>
              <button className="pill" style={{ background: '#2E7D32' }} onClick={() => { setShowSettings(true); }}>New Goal</button>
              <button onClick={() => persistDismissed({ goalMet: goalWeight })} style={{ background: 'none', border: 'none', color: '#2E7D32', fontSize: 16 }}>✕</button>
            </div>
          </div>
        )}

        <div style={{ display: 'flex', gap: 6 }}>
          <RowStat label="Protein" emoji="🥩" value={totals.protein} target={targets.protein} unit="g" kind="floor" gold={goldCards.protein}
            note={[streaks.protein > 1 ? `🔥${streaks.protein}d` : null, weekComparison !== null && weekComparison !== 0 ? `${weekComparison > 0 ? '↑' : '↓'}${Math.abs(weekComparison)}g wk` : null].filter(Boolean).join(' · ') || null} />
          <RowStat label="Net Carbs" emoji="🌾" value={totals.netCarbs} target={targets.netCarbs} unit="g" kind="ceiling" gold={goldCards.netCarbs}
            note={streaks.netCarbs > 1 ? `🔥${streaks.netCarbs}d` : null} />
          <RowStat label="Calories" emoji="🔥" value={netCalories} target={targets.calories} unit="" kind="ceiling" gold={goldCards.calories}
            note={[caloriesBurned > 0 ? `-${Math.round(caloriesBurned)} burned` : null, streaks.calories > 1 ? `🔥${streaks.calories}d` : null].filter(Boolean).join(' · ') || null} />
          <RowStat label="Fat" emoji="💧" value={totals.fat} target={targets.fat} unit="g" kind="floor" gold={goldCards.fat}
            note={streaks.fat > 1 ? `🔥${streaks.fat}d` : null} />
        </div>

        <HydrationCard water={dayData.water} target={targets.water} onAdd={addWater} gold={goldCards.hydration} />

        <button onClick={() => setShowRegulars(true)} className="card" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', border: `1px solid ${BORDER}`, width: '100%', textAlign: 'left' }}>
          <span style={{ fontFamily: "'Oswald', sans-serif", fontSize: 13, letterSpacing: '0.05em', textTransform: 'uppercase', color: BURGUNDY, fontWeight: 600 }}>⭐ Frequent Foods</span>
          <span style={{ color: MUTED, fontSize: 13 }}>{commonFoods.length ? `${commonFoods.length} saved →` : 'None yet →'}</span>
        </button>

        {MEALS.map(m => (
          <MealSection key={m.key} meal={m} foods={dayData.meals[m.key] || []}
            expanded={!!expandedMeals[m.key]} onToggleExpand={() => setExpandedMeals({ ...expandedMeals, [m.key]: !expandedMeals[m.key] })}
            onAdd={() => setAddFoodMeal(m.key)} onAiAdd={() => setAiMeal(m.key)} onRemove={(id) => removeFood(m.key, id)}
            onEdit={(food) => setEditFood({ mealKey: m.key, food })} />
        ))}

        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
          <div className="card" style={{ padding: 12, display: 'flex', flexDirection: 'column', minHeight: 122 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
              <span style={{ fontFamily: "'Oswald', sans-serif", fontSize: 10.5, letterSpacing: '0.03em', textTransform: 'uppercase', color: BURGUNDY, fontWeight: 600 }}>📏 Measure</span>
              <button className="pill" style={{ padding: '4px 7px', fontSize: 10 }} onClick={() => setShowMeasureForm(true)}>+</button>
            </div>
            <div style={{ flex: 1 }}>
              {totalInchesLost !== null ? (
                <div><span style={{ fontFamily: "'Oswald', sans-serif", fontSize: 17, fontWeight: 700, color: totalInchesLost > 0 ? '#16A34A' : TEXT }}>{totalInchesLost > 0 ? '-' : ''}{Math.abs(totalInchesLost).toFixed(1)}"</span></div>
              ) : <div style={{ color: MUTED, fontSize: 11 }}>None yet.</div>}
            </div>
            <button onClick={() => setShowMeasureHistory(true)} style={{ background: 'none', border: 'none', color: MUTED, fontSize: 10, marginTop: 4, padding: 0, textAlign: 'left' }}>History →</button>
          </div>

          <div className="card" style={{ padding: 12, display: 'flex', flexDirection: 'column', minHeight: 122 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
              <span style={{ fontFamily: "'Oswald', sans-serif", fontSize: 10.5, letterSpacing: '0.03em', textTransform: 'uppercase', color: BURGUNDY, fontWeight: 600 }}>Weight</span>
              <button className="pill" style={{ padding: '4px 7px', fontSize: 10 }} onClick={() => setShowWeightForm(true)}>+</button>
            </div>
            <div style={{ flex: 1 }}>
              {latestWeight ? (
                <div>
                  <span style={{ fontFamily: "'Oswald', sans-serif", fontSize: 17, fontWeight: 700 }}>{latestWeight}</span>
                  {startWeight && startWeight !== latestWeight && <div style={{ color: '#16A34A', fontSize: 10.5, marginTop: 2 }}>📉 {(startWeight - latestWeight).toFixed(1)}</div>}
                  {weeksToGoal !== null && <div style={{ color: MUTED, fontSize: 10, marginTop: 2 }}>~{weeksToGoal}wk to goal</div>}
                </div>
              ) : <div style={{ color: MUTED, fontSize: 11 }}>None yet.</div>}
            </div>
            <button onClick={() => setShowWeightHistory(true)} style={{ background: 'none', border: 'none', color: MUTED, fontSize: 10, marginTop: 4, padding: 0, textAlign: 'left' }}>History →</button>
          </div>

          <div className="card" style={{ padding: 12, display: 'flex', flexDirection: 'column', minHeight: 122 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
              <span style={{ display: 'flex', alignItems: 'center', gap: 4, fontFamily: "'Oswald', sans-serif", fontSize: 10.5, letterSpacing: '0.03em', textTransform: 'uppercase', color: BURGUNDY, fontWeight: 600 }}>♥ BP</span>
              <button className="pill" style={{ padding: '4px 7px', fontSize: 10 }} onClick={() => setShowBpForm(true)}>+</button>
            </div>
            <div style={{ flex: 1 }}>
              {latestBp ? (

      setT({ calories: level.calories, protein: level.protein, netCarbs: level.carbs, fat: level.fat, water: level.water });

      setSelectedLevel(null);

                <div style={{ fontFamily: "'Oswald', sans-serif", fontSize: 15, fontWeight: 700, color: BURGUNDY, marginBottom: 6 }}>Level {level.num}</div>

// ---------- PIN protection ----------
function PinSetupScreen({ onDone }) {
  const [pin, setPin] = useState('');
  const [confirmPin, setConfirmPin] = useState('');
  const [birthYear, setBirthYear] = useState('');
  const [error, setError] = useState(null);
  const [saving, setSaving] = useState(false);

  const submit = async () => {
    setError(null);
    if (!/^\d{4,6}$/.test(pin)) { setError('PIN should be 4-6 digits.'); return; }
    if (pin !== confirmPin) { setError("PINs don't match."); return; }
    const yearNum = parseInt(birthYear);
    if (!yearNum || yearNum < 1900 || yearNum > new Date().getFullYear()) { setError('Enter a valid birth year.'); return; }
    setSaving(true);
    try {
      const deviceId = getDeviceId();
      const res = await fetch('/api/auth?action=setup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ deviceId, pin, birthYear: yearNum }) });
      if (!res.ok) throw new Error('failed');
      onDone();
    } catch (e) {
      setError("Couldn't reach the server to save your PIN. Check your connection and try again, or skip for now.");
    }
    setSaving(false);
  };

  return (
    <div style={{ background: GRAY, minHeight: '100vh', fontFamily: "'Inter', sans-serif", color: TEXT, padding: '30px 20px', display: 'flex', alignItems: 'center' }}>
      <div style={{ maxWidth: 400, margin: '0 auto', width: '100%' }}>
        <h1 style={{ fontFamily: "'Oswald', sans-serif", fontSize: 22, fontWeight: 700, color: WHITE, marginBottom: 8 }}>Protect Your Data</h1>
        <p style={{ color: '#C9C6CA', fontSize: 13, marginBottom: 20, lineHeight: 1.5 }}>
          Your data now lives in the cloud, not just this device. Set a PIN so it can't be accessed from another phone without it. You'll only need to re-enter it about once a month, not every time you open the app.
        </p>
        <div style={{ background: WHITE, borderRadius: 14, padding: 20 }}>
          <Field label="Choose a PIN (4-6 digits)"><input type="tel" inputMode="numeric" value={pin} onChange={e => setPin(e.target.value.replace(/\D/g, ''))} maxLength={6} /></Field>
          <Field label="Confirm PIN"><input type="tel" inputMode="numeric" value={confirmPin} onChange={e => setConfirmPin(e.target.value.replace(/\D/g, ''))} maxLength={6} /></Field>
          <Field label="Birth year (used only if you forget your PIN)"><input type="number" inputMode="numeric" value={birthYear} onChange={e => setBirthYear(e.target.value)} placeholder="e.g. 1967" /></Field>
          {error && <div style={{ color: RED, fontSize: 12.5, marginBottom: 10 }}>{error}</div>}
          <PrimaryButton onClick={submit} label={saving ? 'Saving…' : 'Set PIN'} disabled={saving} />
          <button onClick={onDone} style={{ width: '100%', background: 'none', border: 'none', color: MUTED, fontSize: 12.5, marginTop: 10, padding: 8 }}>Skip for now</button>
        </div>
      </div>
    </div>
  );
}

function PinVerifyScreen({ onUnlocked }) {
  const [pin, setPin] = useState('');
  const [error, setError] = useState(null);
  const [checking, setChecking] = useState(false);
  const [showRecover, setShowRecover] = useState(false);

  const submit = async () => {
    setError(null);
    setChecking(true);
    try {
      const deviceId = getDeviceId();
      const res = await fetch('/api/auth?action=verify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ deviceId, pin }) });
      const data = await res.json();
      if (data.valid) onUnlocked();
      else setError('Incorrect PIN. Try again.');
    } catch (e) {
      setError("Couldn't reach the server. Check your connection and try again.");
    }
    setChecking(false);
  };

  if (showRecover) return <PinRecoverScreen onDone={onUnlocked} onBack={() => setShowRecover(false)} />;

  return (
    <div style={{ background: GRAY, minHeight: '100vh', fontFamily: "'Inter', sans-serif", color: TEXT, padding: '30px 20px', display: 'flex', alignItems: 'center' }}>
      <div style={{ maxWidth: 400, margin: '0 auto', width: '100%' }}>
        <h1 style={{ fontFamily: "'Oswald', sans-serif", fontSize: 22, fontWeight: 700, color: WHITE, marginBottom: 8 }}>Enter Your PIN</h1>
        <p style={{ color: '#C9C6CA', fontSize: 13, marginBottom: 20 }}>Monthly check-in to keep your cloud data protected.</p>
        <div style={{ background: WHITE, borderRadius: 14, padding: 20 }}>
          <Field label="PIN"><input type="tel" inputMode="numeric" value={pin} onChange={e => setPin(e.target.value.replace(/\D/g, ''))} maxLength={6} autoFocus /></Field>
          {error && <div style={{ color: RED, fontSize: 12.5, marginBottom: 10 }}>{error}</div>}
          <PrimaryButton onClick={submit} label={checking ? 'Checking…' : 'Unlock'} disabled={checking} />
          <button onClick={() => setShowRecover(true)} style={{ width: '100%', background: 'none', border: 'none', color: BURGUNDY, fontSize: 12.5, marginTop: 10, padding: 8, fontWeight: 600 }}>Forgot your PIN?</button>
        </div>
      </div>
    </div>
  );
}

function PinRecoverScreen({ onDone, onBack }) {
  const [birthYear, setBirthYear] = useState('');
  const [newPin, setNewPin] = useState('');
  const [confirmPin, setConfirmPin] = useState('');
  const [error, setError] = useState(null);
  const [checking, setChecking] = useState(false);

  const submit = async () => {
    setError(null);
    if (!/^\d{4,6}$/.test(newPin)) { setError('New PIN should be 4-6 digits.'); return; }
    if (newPin !== confirmPin) { setError("PINs don't match."); return; }
    setChecking(true);
    try {
      const deviceId = getDeviceId();
      const res = await fetch('/api/auth?action=recover', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ deviceId, birthYear: parseInt(birthYear), newPin }) });
      const data = await res.json();
      if (data.valid) onDone();
      else setError('That birth year doesn\'t match what we have on file.');
    } catch (e) {
      setError("Couldn't reach the server. Check your connection and try again.");
    }
    setChecking(false);
  };

  return (
    <div style={{ background: GRAY, minHeight: '100vh', fontFamily: "'Inter', sans-serif", color: TEXT, padding: '30px 20px', display: 'flex', alignItems: 'center' }}>
      <div style={{ maxWidth: 400, margin: '0 auto', width: '100%' }}>
        <h1 style={{ fontFamily: "'Oswald', sans-serif", fontSize: 22, fontWeight: 700, color: WHITE, marginBottom: 8 }}>Reset Your PIN</h1>
        <p style={{ color: '#C9C6CA', fontSize: 13, marginBottom: 20 }}>Confirm your birth year to set a new PIN.</p>
        <div style={{ background: WHITE, borderRadius: 14, padding: 20 }}>
          <Field label="Birth year"><input type="number" inputMode="numeric" value={birthYear} onChange={e => setBirthYear(e.target.value)} /></Field>

          <Field label="Confirm new PIN"><input type="tel" inputMode="numeric" value={confirmPin} onChange={e => setConfirmPin(e.target.value.replace(/\D/g, ''))} maxLength={6} /></Field>
          {error && <div style={{ color: RED, fontSize: 12.5, marginBottom: 10 }}>{error}</div>}
          <PrimaryButton onClick={submit} label={checking ? 'Checking…' : 'Set New PIN'} disabled={checking} />

        </div>
      </div>
    </div>
  );
}

// ---------- Frequent Foods ----------
function RegularsList({ regulars, remaining, onEdit, onDelete, onTogglePin, onBatchPick, onCleanup }) {
  const [selected, setSelected] = useState([]);
  const [qtys, setQtys] = useState({});
  const [whatFits, setWhatFits] = useState(false);
  const [cleanupMsg, setCleanupMsg] = useState(null);

  const toggleSelect = (id) => {
    if (selected.includes(id)) { setSelected(selected.filter(x => x !== id)); }
    else { setSelected([...selected, id]); setQtys(q => ({ ...q, [id]: q[id] || 1 })); }
  };
  const setQty = (id, q) => setQtys(prev => ({ ...prev, [id]: Math.max(1, q) }));

  const fits = (r) => {
    if (!whatFits) return true;
    const netC = Math.max(0, r.carbs - r.fiber);
    return netC <= remaining.netCarbs && r.calories <= remaining.calories;
  };
  const visible = regulars.filter(fits);

  const groups = {};
  visible.forEach(r => { const key = r.restaurant || 'Other'; (groups[key] = groups[key] || []).push(r); });
  const hasRestaurants = visible.some(r => r.restaurant);
  const groupKeys = hasRestaurants ? Object.keys(groups) : ['Other'];

  const confirmBatch = () => {
    const items = regulars.filter(r => selected.includes(r.id)).map(r => ({ ...r, qty: qtys[r.id] || 1 }));
    if (items.length) onBatchPick(items);
    setSelected([]); setQtys({});
  };

  const runCleanup = () => {
    const n = onCleanup();
    setCleanupMsg(n > 0 ? `Merged ${n} duplicate${n > 1 ? 's' : ''}.` : 'No duplicates found.');
    setTimeout(() => setCleanupMsg(null), 3000);
  };

  return (
    <div>
      <div style={{ display: 'flex', gap: 8, marginBottom: 12 }}>
        <button onClick={() => setWhatFits(!whatFits)} style={{ flex: 1, padding: 8, borderRadius: 8, border: `1.5px solid ${whatFits ? BURGUNDY : BORDER}`, background: whatFits ? '#F6F1F2' : WHITE, color: whatFits ? BURGUNDY : MUTED, fontWeight: 600, fontSize: 12 }}>{whatFits ? 'Showing what fits' : 'What fits?'}</button>
        <button onClick={runCleanup} style={{ padding: '8px 12px', borderRadius: 8, border: `1.5px solid ${BORDER}`, background: WHITE, color: MUTED, fontWeight: 600, fontSize: 12, whiteSpace: 'nowrap' }}>Clean Up</button>
      </div>
      {cleanupMsg && <div style={{ fontSize: 12, color: '#2E7D32', marginBottom: 10 }}>{cleanupMsg}</div>}

      {visible.length === 0 ? (
        <div style={{ color: MUTED, fontSize: 13 }}>{regulars.length === 0 ? "Log a few foods and they'll show up here for quick re-adding." : "Nothing fits your remaining macros right now."}</div>
      ) : (
        groupKeys.map(gk => (
          <div key={gk || 'all'} style={{ marginBottom: hasRestaurants ? 14 : 0 }}>
            {hasRestaurants && <div style={{ fontSize: 11, fontWeight: 700, color: BURGUNDY, textTransform: 'uppercase', letterSpacing: '0.04em', marginBottom: 6 }}>{gk}</div>}
            <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
              {groups[gk].map(r => (
                <div key={r.id} style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '8px 0', borderBottom: `1px solid ${BORDER}` }}>
                  <button onClick={() => toggleSelect(r.id)} style={{ background: 'none', border: 'none', flexShrink: 0 }}>
                    <div style={{ width: 18, height: 18, borderRadius: 5, border: `1.5px solid ${selected.includes(r.id) ? BURGUNDY : '#C9C6D1'}`, background: selected.includes(r.id) ? BURGUNDY : 'transparent', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                      {selected.includes(r.id) && <span style={{ color: WHITE, fontSize: 11, fontWeight: 700 }}>✓</span>}
                    </div>
                  </button>
                  <button onClick={() => toggleSelect(r.id)} style={{ background: 'none', border: 'none', textAlign: 'left', flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 14, fontWeight: 500, display: 'flex', alignItems: 'center', gap: 5 }}>
                      {r.pinned && <span style={{ fontSize: 11 }}>📌</span>}
                      <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{r.name}</span>
                    </div>
                    <div style={{ fontSize: 12, color: MUTED }}>{Math.round(r.protein)}g P · {Math.max(0, Math.round(r.carbs - r.fiber))}g net C</div>
                  </button>
                  {selected.includes(r.id) && (
                    <div style={{ display: 'flex', alignItems: 'center', gap: 4, flexShrink: 0 }}>
                      <button onClick={() => setQty(r.id, (qtys[r.id] || 1) - 1)} style={{ width: 22, height: 22, borderRadius: 5, border: `1px solid ${BORDER}`, background: WHITE, color: BURGUNDY, fontSize: 13, fontWeight: 700 }}>−</button>
                      <span style={{ fontSize: 12.5, fontWeight: 600, minWidth: 14, textAlign: 'center' }}>{qtys[r.id] || 1}</span>
                      <button onClick={() => setQty(r.id, (qtys[r.id] || 1) + 1)} style={{ width: 22, height: 22, borderRadius: 5, border: `1px solid ${BORDER}`, background: WHITE, color: BURGUNDY, fontSize: 13, fontWeight: 700 }}>+</button>
                    </div>
                  )}
                  <button onClick={() => onTogglePin(r.id)} style={{ background: 'none', border: 'none', color: r.pinned ? BURGUNDY : '#C9C6D1', fontSize: 15 }}>📌</button>
                  <button onClick={() => onEdit(r)} style={{ background: 'none', border: 'none', color: '#B8B5BD', fontSize: 14 }}>✎</button>
                  <button onClick={() => onDelete(r.id)} style={{ background: 'none', border: 'none', color: MUTED, fontSize: 15 }}>✕</button>
                </div>
              ))}
            </div>
          </div>
        ))
      )}

      {selected.length > 0 && (
        <div style={{ position: 'sticky', bottom: 0, left: 0, right: 0, background: WHITE, paddingTop: 10, marginTop: 14, boxShadow: '0 -8px 12px -6px rgba(0,0,0,0.08)' }}>
          <PrimaryButton onClick={confirmBatch} label={`Add ${selected.length} item${selected.length > 1 ? 's' : ''}`} />
        </div>
      )}
    </div>
  );
}

function MealSection({ meal, foods, expanded, onToggleExpand, onAdd, onAiAdd, onRemove, onEdit }) {

  return (
    <div className="card">
      <button onClick={onToggleExpand} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', width: '100%', background: 'none', border: 'none', textAlign: 'left', marginBottom: expanded ? 12 : 0 }}>

          <span>{meal.emoji}</span>
          <span style={{ fontFamily: "'Oswald', sans-serif", fontSize: 14, fontWeight: 600, color: TEXT }}>{meal.label}</span>
          {!expanded && (
            <span style={{ fontSize: 11.5, color: MUTED }}>{foods.length === 0 ? '— nothing logged' : `— ${foods.length} item${foods.length > 1 ? 's' : ''} · ${Math.round(totals.protein)}g P · ${Math.round(totals.calories)} cal`}</span>
          )}
        </div>
        <span style={{ color: MUTED, fontSize: 12 }}>{expanded ? '▲' : '▼'}</span>
      </button>

      {expanded && (
        <>
          <div style={{ display: 'flex', gap: 6, marginBottom: 12 }}>
            <button onClick={onAdd} style={{ background: MANUAL_GRAY, border: 'none', borderRadius: 8, padding: '7px 12px', color: WHITE, fontSize: 12.5, fontWeight: 700 }}>Manual+</button>
            <button onClick={onAiAdd} style={{ background: GRAY, border: 'none', borderRadius: 8, padding: '7px 12px', color: WHITE, fontSize: 12.5, fontWeight: 700 }}>Smart+</button>
          </div>

          {foods.length === 0 ? (
            <div style={{ color: MUTED, fontSize: 13 }}>Nothing logged.</div>
          ) : (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
              {foods.map(f => {
                const e = effective(f);

                    <button onClick={() => onEdit(f)} style={{ background: 'none', border: 'none', textAlign: 'left', flex: 1 }}>
                      <div style={{ fontSize: 13.5, fontWeight: 500, display: 'flex', alignItems: 'center', gap: 5 }}>
                        {f.name}{f.estimated && <span style={{ color: '#B8721F' }}>*</span>}{pct !== 100 && <span style={{ fontSize: 11, color: MUTED, fontWeight: 400 }}>({pct}%)</span>}
                        <span style={{ fontSize: 11, color: '#B8B5BD' }}>✎</span>
                      </div>
                      <div style={{ fontSize: 11.5, color: MUTED }}>{Math.round(e.protein)}g P · {Math.max(0, Math.round(e.carbs - e.fiber))}g net C · {Math.round(e.fat)}g F · {Math.round(e.calories)} cal</div>
                    </button>
                    <button onClick={() => onRemove(f.id)} style={{ background: 'none', border: 'none', color: MUTED, fontSize: 14 }}>✕</button>
                  </div>
                );
              })}
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ---------- Smart Add: Search -> review/edit/delete -> Add ----------
function AIAddModal({ mealLabel, onClose, onSave }) {
  const [tab, setTab] = useState('text');
  const [text, setText] = useState('');
  const [photo, setPhoto] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [results, setResults] = useState(null); // array of {tempId, name, protein, carbs, fiber, fat, calories}
  const [voiceError, setVoiceError] = useState(null);
  const fileRef = useRef();

  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => setPhoto(reader.result);
    reader.readAsDataURL(file);
  };

  const search = async () => {
    setError(null);
    if (tab === 'text' && !text.trim()) return;
    if ((tab === 'photo' || tab === 'receipt') && !photo) return;
    setLoading(true);
    try {
      const mode = tab === 'text' ? 'text' : tab; // 'text' | 'photo' | 'receipt'
      const body = mode === 'text' ? { mode, text } : { mode, image: photo };
      const res = await fetch('/api/estimate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok) {
        if (data.error === 'not_configured') setError("AI estimation isn't set up yet on this deployment — add a GEMINI_API_KEY to enable it, or log this manually for now.");
        else setError(data.message || 'Something went wrong estimating this. Try again or log it manually.');
        setLoading(false);
        return;
      }
      if (!data.foods || !data.foods.length) {
        setError("Couldn't identify any foods from that — try being more specific, or log it manually.");
        setLoading(false);
        return;
      }
      setResults(data.foods.map(f => ({ ...f, tempId: Math.random() })));
    } catch (e) {
      setError('Could not reach the AI estimator. Check your connection and try again.');
    }
    setLoading(false);
  };

  const updateResult = (tempId, updates) => setResults(results.map(r => r.tempId === tempId ? { ...r, ...updates } : r));
  const removeResult = (tempId) => setResults(results.filter(r => r.tempId !== tempId));

  const confirmAdd = () => {
    if (!results || !results.length) return;
    onSave(results.map(({ tempId, ...rest }) => rest));
  };

  const num = (v) => parseFloat(v) || 0;

  return (
    <Modal title={`Smart Add — ${mealLabel}`} onClose={onClose}>
      {!results ? (
        <>
          <div style={{ display: 'flex', gap: 5, marginBottom: 16 }}>
            {[['text', 'Describe It'], ['photo', 'Photo'], ['receipt', 'Receipt']].map(([key, label]) => (
              <button key={key} onClick={() => setTab(key)} style={{ flex: 1, padding: 9, borderRadius: 8, border: `1.5px solid ${tab === key ? BURGUNDY : BORDER}`, background: tab === key ? '#F6F1F2' : WHITE, color: tab === key ? BURGUNDY : MUTED, fontWeight: 600, fontSize: 12 }}>{label}</button>
            ))}
          </div>

          {tab === 'text' ? (
            <Field label="What did you eat?">
              <div style={{ position: 'relative' }}>
                <textarea value={text} onChange={e => setText(e.target.value)} placeholder={'e.g. "Core Power 42g protein shake and a Sonic small chicken nugget"'}
                  rows={3} style={{ fontFamily: 'inherit', background: '#FAFAFB', border: `1px solid ${BORDER}`, color: TEXT, borderRadius: 8, padding: '10px 40px 10px 11px', fontSize: 14, width: '100%', resize: 'vertical' }} autoFocus />
                <button onClick={() => {
                  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                  if (!SR) { setVoiceError("Voice input isn't supported in Safari — type instead."); return; }
                  setVoiceError(null);
                  const rec = new SR();
                  rec.lang = 'en-US';
                  rec.onresult = (e) => setText((prev) => (prev ? prev + ' ' : '') + e.results[0][0].transcript);
                  rec.onerror = () => setVoiceError("Couldn't hear that — try typing instead.");
                  rec.start();
                }} style={{ position: 'absolute', right: 8, top: 8, background: 'none', border: 'none', fontSize: 18 }}>🎙️</button>
              </div>
              {voiceError && <div style={{ fontSize: 11.5, color: MUTED, marginTop: 4 }}>{voiceError}</div>}
            </Field>
          ) : (
            <div onClick={() => fileRef.current.click()} style={{ border: `1.5px dashed ${BORDER}`, borderRadius: 10, padding: photo ? 0 : 24, textAlign: 'center', marginBottom: 14, overflow: 'hidden', cursor: 'pointer' }}>
              {photo ? <img src={photo} alt="upload" style={{ width: '100%', display: 'block' }} /> : <div style={{ color: MUTED, fontSize: 13 }}>{tab === 'receipt' ? '🧾' : '📷'}<div>Tap to {tab === 'receipt' ? 'photograph your receipt' : 'add a photo'}</div></div>}
            </div>
          )}
          <input ref={fileRef} type="file" accept="image/*" onChange={handleFile} style={{ display: 'none' }} />

          {tab === 'receipt' && <div style={{ fontSize: 11.5, color: MUTED, marginTop: -8, marginBottom: 10 }}>Works best for a single fast-food receipt, not a full grocery haul.</div>}

          {error && <div style={{ background: '#FBEAEA', border: '1px solid #F5C6C6', borderRadius: 10, padding: 10, fontSize: 12.5, color: RED, marginTop: 10 }}>{error}</div>}

          <PrimaryButton onClick={search} disabled={loading} label={loading ? 'Searching…' : 'Search'} />
        </>
      ) : (
        <>
          <div style={{ fontSize: 12, color: MUTED, marginBottom: 12 }}>Review and edit before adding — nothing's logged yet.</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12, marginBottom: 14 }}>
            {results.map(r => (
              <div key={r.tempId} style={{ border: `1px solid ${BORDER}`, borderRadius: 10, padding: 12 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                  <input value={r.name} onChange={e => updateResult(r.tempId, { name: e.target.value })} style={{ fontWeight: 600, fontSize: 13.5, border: 'none', background: 'none', padding: '2px 0', flex: 1 }} />
                  <button onClick={() => removeResult(r.tempId)} style={{ background: 'none', border: 'none', color: MUTED, fontSize: 15 }}>✕</button>
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 6 }}>
                  <div><label style={{ fontSize: 10, color: MUTED }}>Protein</label><input type="number" value={r.protein} onChange={e => updateResult(r.tempId, { protein: num(e.target.value) })} style={{ fontSize: 12, padding: '5px 6px' }} /></div>
                  <div><label style={{ fontSize: 10, color: MUTED }}>Carbs</label><input type="number" value={r.carbs} onChange={e => updateResult(r.tempId, { carbs: num(e.target.value) })} style={{ fontSize: 12, padding: '5px 6px' }} /></div>
                  <div><label style={{ fontSize: 10, color: MUTED }}>Fiber</label><input type="number" value={r.fiber} onChange={e => updateResult(r.tempId, { fiber: num(e.target.value) })} style={{ fontSize: 12, padding: '5px 6px' }} /></div>
                  <div><label style={{ fontSize: 10, color: MUTED }}>Fat</label><input type="number" value={r.fat} onChange={e => updateResult(r.tempId, { fat: num(e.target.value) })} style={{ fontSize: 12, padding: '5px 6px' }} /></div>
                  <div style={{ gridColumn: 'span 2' }}><label style={{ fontSize: 10, color: MUTED }}>Calories</label><input type="number" value={r.calories} onChange={e => updateResult(r.tempId, { calories: num(e.target.value) })} style={{ fontSize: 12, padding: '5px 6px' }} /></div>
                </div>
              </div>
            ))}
            {results.length === 0 && <div style={{ color: MUTED, fontSize: 13 }}>All items removed — go back and search again.</div>}
          </div>
          <button onClick={() => setResults(null)} style={{ background: 'none', border: 'none', color: BURGUNDY, fontSize: 12.5, fontWeight: 600, marginBottom: 4 }}>← Search again</button>
          <PrimaryButton onClick={confirmAdd} disabled={results.length === 0} label={`Add to ${mealLabel}`} />
        </>
      )}
    </Modal>
  );
}

function EditFoodModal({ food, onClose, onSave, onDelete }) {

function SleepModal({ initial, forDate, onClose, onSave }) {
  const [asleep, setAsleep] = useState(initial?.asleep || '22:30'); const [wake, setWake] = useState(initial?.wake || '05:45');
  const [quality, setQuality] = useState(initial?.quality || 3); const [bathroom, setBathroom] = useState(initial?.bathroom ?? '');

  const computeHours = () => {
    if (!asleep || !wake) return null;
    const [ah, am] = asleep.split(':').map(Number);
    const [wh, wm] = wake.split(':').map(Number);
    let mins = (wh * 60 + wm) - (ah * 60 + am);
    if (mins <= 0) mins += 24 * 60; // wake is next day
    return Math.round((mins / 60) * 10) / 10;
  };

  const submit = () => {
    const hours = computeHours();
    if (hours === null) return;
    onSave({ date: initial?.date || forDate || todayISO(), id: initial?.id || (Date.now() + Math.random()), asleep, wake, hours, quality, bathroom: parseInt(bathroom) || 0 });
  };

  return (
    <Modal title={initial ? 'Edit Sleep' : 'Log Sleep'} onClose={onClose}>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
        <Field label="Fell asleep"><input type="time" value={asleep} onChange={e => setAsleep(e.target.value)} /></Field>

      <Field label="Times woken (bathroom)"><input type="number" value={bathroom} onChange={e => setBathroom(e.target.value)} placeholder="0" /></Field>
      <Field label={`Quality: ${quality}/5`}>
        <div style={{ display: 'flex', gap: 6 }}>
          {[1, 2, 3, 4, 5].map(n => (
            <button key={n} onClick={() => setQuality(n)} style={{ flex: 1, padding: 10, borderRadius: 8, border: `1.5px solid ${quality === n ? BURGUNDY : BORDER}`, background: quality === n ? BURGUNDY : WHITE, color: quality === n ? WHITE : TEXT, fontWeight: 700 }}>{n}</button>

function SimpleLineChart({ data, target }) {
  const vals = data.map(d => d.value).filter(v => v !== null && v !== undefined);
  if (vals.length < 2) return <div style={{ color: MUTED, fontSize: 12 }}>Not enough data yet.</div>;
  const min = Math.min(...vals, target ?? Infinity), max = Math.max(...vals, target ?? -Infinity);
  const range = max - min || 1;
  const w = 440, h = 180, pad = 20;
  const step = (w - pad * 2) / (data.length - 1);
  const pts = data.map((d, i) => {
    const x = pad + i * step;
    const y = d.value == null ? null : h - pad - ((d.value - min) / range) * (h - pad * 2);
    return { x, y, label: d.label };
  });
  const line = pts.filter(p => p.y !== null).map(p => `${p.x},${p.y}`).join(' ');
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: '100%', height: 180 }}>
      {target != null && <line x1={pad} y1={h - pad - ((target - min) / range) * (h - pad * 2)} x2={w - pad} y2={h - pad - ((target - min) / range) * (h - pad * 2)} stroke="#D9D6E0" strokeDasharray="4 4" strokeWidth={1} />}
      <polyline points={line} fill="none" stroke={BURGUNDY} strokeWidth={2.5} strokeLinejoin="round" strokeLinecap="round" />
      {pts.map((p, i) => p.y !== null && <circle key={i} cx={p.x} cy={p.y} r={3} fill={BURGUNDY} />)}
      {pts.map((p, i) => (i % Math.ceil(pts.length / 6) === 0) && <text key={'t' + i} x={p.x} y={h - 4} fontSize="9" fill={MUTED} textAnchor="middle">{p.label}</text>)}
    </svg>
  );
}
function SimpleBarChart({ data, colorFn }) {
  const vals = data.map(d => d.value);
  const max = Math.max(...vals, 1);
  const w = 440, h = 180, pad = 20, gap = 6;
  const barW = (w - pad * 2) / data.length - gap;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: '100%', height: 180 }}>
      {data.map((d, i) => {
        const barH = (d.value / max) * (h - pad * 2);
        const x = pad + i * ((w - pad * 2) / data.length) + gap / 2;
        const y = h - pad - barH;
        return (
          <g key={i}>
            <rect x={x} y={y} width={barW} height={barH} rx={3} fill={colorFn ? colorFn(d) : BURGUNDY} />
            <text x={x + barW / 2} y={h - 4} fontSize="9" fill={MUTED} textAnchor="middle">{d.label}</text>
          </g>
        );
      })}
    </svg>
  );
}

    if (metric === 'weight') {
      const map = Object.fromEntries(weightLog.map(w => [w.date, w.weight]));
      series = dates.map(d => ({ date: d, value: map[d] ?? null }));
    } else {
      series = dates.map(d => {
        const parsed = load(DAY_KEY(d), null);
        if (!parsed) return { date: d, value: 0 };
        const foods = Object.values(parsed.meals || {}).flat();
        const t = foods.reduce((acc, f) => { const e = effective(f); return { calories: acc.calories + e.calories, protein: acc.protein + e.protein, netCarbs: acc.netCarbs + Math.max(0, e.carbs - e.fiber), fat: acc.fat + e.fat }; }, { calories: 0, protein: 0, netCarbs: 0, fat: 0 });
        return { date: d, value: t[metric] };
      });
    }
    const target = metric === 'weight' ? null : targets[metric];
    const kind = METRICS.find(m => m.key === metric).kind;
    let output;
    if (view === 'trend') output = series.map(s => ({ label: s.date.slice(5), value: s.value }));
    else if (view === 'averages') {
      const chunks = []; for (let i = 0; i < series.length; i += 7) chunks.push(series.slice(i, i + 7));
      output = chunks.map((c, i) => { const vals = c.map(x => x.value).filter(v => v !== null); const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0; return { label: `Wk ${i + 1}`, value: Math.round(avg * 10) / 10 }; });
    } else {
      output = series.map(s => ({ label: s.date.slice(5), value: s.value ?? 0, met: target ? (kind === 'floor' ? s.value >= target : s.value <= target) : null }));
    }
    setChartData({ output, target, kind });
  };

  return (
    <Modal title="History" onClose={onClose}>
      <Field label="Metric"><select value={metric} onChange={e => { setMetric(e.target.value); setChartData(null); }}>{METRICS.map(m => <option key={m.key} value={m.key}>{m.label}</option>)}</select></Field>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
        <Field label="Range"><select value={range} onChange={e => { setRange(e.target.value); setChartData(null); }}><option value="week">Week</option><option value="month">Month</option></select></Field>
        <Field label="View"><select value={view} onChange={e => { setView(e.target.value); setChartData(null); }}><option value="trend">Daily trend</option><option value="averages">Weekly averages</option><option value="adherence">Adherence</option></select></Field>
      </div>
      <PrimaryButton onClick={runQuery} label="Show Graph" />
      {chartData && (
        <div style={{ marginTop: 20 }}>
          {view === 'trend' ? (
            <SimpleLineChart data={chartData.output} target={chartData.target} />
          ) : (
            <SimpleBarChart data={chartData.output} colorFn={view === 'adherence' ? (d => d.met === null ? BURGUNDY : (d.met ? BLUE : RED)) : null} />
          )}
        </div>
      )}
    </Modal>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<CarbTrack />);
